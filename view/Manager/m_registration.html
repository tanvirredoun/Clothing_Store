
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manager Registration</title>
</head>

<body>

    <h1>Online Bookshop</h1>

    <button>Home</button>
    <button>About</button>
    <button>Contact Us</button>

    <hr>

    <h2>Manager Registration</h2>



        <table>

           
            <tr>
                <td>Name:</td>
                <td><input type="text" name="name" placeholder="Enter your name" required></td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td><input type="tel" name="phone" placeholder="Enter your number"required></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td><input type="email" name="email" placeholder="Enter your email"required></td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td><input type="date" name="dob" required></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="Male" required> Male
                    <input type="radio" name="gender" value="Female"> Female
                    <input type="radio" name="gender" value="Other"> Other
                </td>
            </tr>

            <tr>
                <td>NID Number:</td>
                <td><input type="text" name="nid" placeholder="Enter your NID number"required></td>
            </tr>

            <tr>
                <td>Address:</td>
                <td><textarea name="address" rows="3" cols="30" placeholder="Enter your address"required></textarea></td>
            </tr>

            <tr>
                <td>Department:</td>
                <td>
                    <select name="department" required>
                        <option value="">Select Department</option>
                        <option value="Book Inventory">Book Inventory</option>
                        <option value="Sales and Orders">Sales and Orders</option>
                        <option value="Customer Service">Customer Service</option>
                        <option value="Delivery Management">Delivery Management</option>
                        <option value="Accounts and Finance">Accounts and Finance</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Joining Date:</td>
                <td><input type="date" name="joining_date" required></td>
            </tr>

            <tr>
                <td>Work Experience:</td>
                <td><textarea name="experience" rows="3" cols="30" ></textarea></td>
            </tr>

            <tr>
                <td>Salary:</td>
                <td><input type="number" name="salary"placeholder="Enter your desired salary" min="0"></td>
            </tr>

            <tr>
                <td>Picture:</td>
                <td><input type="file" name="picture" accept="image/*" required></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" placeholder="Abcd@123" required></td>
            </tr>
             <tr>
                <td>Confirm Password:</td>
                <td><input type="password" name="confirm password" placeholder="Rewrite your password" required></td>
            </tr>


            <tr>
                <td><button type="reset">Cancel</button></td>
                <td><button type="submit">Register</button></td>
            </tr>

            <tr>
                <td >
                    Already have an account?
                    <button>Login</button>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
