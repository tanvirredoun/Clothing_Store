
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Registration</title>
</head>

<body>

    <h1>Online Bookshop</h1>

    <button>Home</button>
    <button>About</button>
    <button>Contact Us</button>

    <hr>

    <h2>Admin Registration</h2>



        <table>

            <tr>
                <td>Name:</td>
                <td><input type="text" name="name" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td><input type="date" name="dob" required></td>
            </tr>
             <tr>
                <td>Phone Number:</td>
                <td><input type="tel" name="phone"placeholder="Enter your number" required></td>
            </tr>

            <tr>
                <td>NID Number:</td>
                <td><input type="number" name="nid" placeholder="Enter your NID number" required></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="Male" required> Male
                    <input type="radio" name="gender" value="Female" required> Female
                    <input type="radio" name="gender" value="Other" required> Other
                </td>
            </tr>
             <tr>
                <td>Work Experience:</td>
                <td>
                    <textarea name="experience" rows="3" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox" name="skills" value="Management"> Management
                    <br>
                    <input type="checkbox" name="skills" value="Computer"> Computer
                    <br>
                    <input type="checkbox" name="skills" value="Communication"> Communication
                    <br>
                    <input type="checkbox" name="skills" value="Accounting"> Accounting
                </td>
            </tr>

           

           

            <tr>
                <td>Picture:</td>
                <td><input type="file" name="picture" accept="image/*" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" placeholder="Abcd@123"required></td>
            </tr>
            <tr>
                <td>Confirm Password:</td>
                <td><input type="password" name="confirm password"  placeholder="Rewrite your password"required></td>
            </tr>
            
            
            <tr>
                <td>
                    <button type="reset">Cancel</button>
                </td>
                <td>
                    <button type="submit">Register Admin</button>
                </td>
            </tr>

            <tr>
                <td >
                    Already have an account?
                    <button>Login</button>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
